# Bezlo AI test — example workflow.
# Copy into .github/workflows/ in the repo you want to test (not the extension repo).
name: Mobile UI test (Bezlo AI)
on:
  pull_request:
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app
        run: |
          # replace with your app's dev server (must listen on a URL the job can reach)
          npm ci && npm run dev &
          npx wait-on http://localhost:3000
      - name: Bezlo AI test
        id: bezlo
        uses: gba3124/bezlo@main
        with:
          url: http://localhost:3000
          device: iphone16
          steps: |
            [{"type":"click","text":"Sign in"},
             {"type":"type","selector":"#email","value":"qa@example.com","submit":true}]
          asserts: |
            [{"type":"noOverflow"},{"type":"noConsoleErrors"}]
          record: 'true'
      - name: Comment result on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pass = '${{ steps.bezlo.outputs.pass }}' === 'true';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `${pass ? '✅' : '❌'} Bezlo AI test — report: ${{ steps.bezlo.outputs.report }}`,
            });
